{% extends "layouts/admin_base.html" %}

{% block content %}
<div class="page-header">
    <h2><i class="bi bi-box-arrow-in-down me-2"></i>Nhập Kho</h2>
    <a href="{{ url_for('admin.inventory') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Quay lại kho</a>
</div>

<div class="bg-white rounded-4 p-4 shadow-sm">
    <form action="{{ url_for('admin.import_stock') }}" method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Sản phẩm <span class="text-danger">*</span></label>
                <select name="product_id" class="form-select" required>
                    <option value="">-- Chọn sản phẩm --</option>
                    {% for p in products %}
                        <option value="{{ p.id }}">{{ p.name }} (Tồn: {{ p.stock }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Nhà cung cấp</label>
                <select name="supplier_id" class="form-select">
                    <option value="">-- Không chọn --</option>
                    {% for s in suppliers %}
                        <option value="{{ s.id }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Số lượng nhập <span class="text-danger">*</span></label>
                <input type="number" class="form-control" name="quantity" required min="1" placeholder="VD: 50">
            </div>
            <div class="col-md-8">
                <label class="form-label fw-semibold">Ghi chú</label>
                <input type="text" class="form-control" name="note" placeholder="VD: Nhập đợt 3 tháng 9/2024">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-gradient btn-lg px-4">
                    <i class="bi bi-box-arrow-in-down me-1"></i> Xác nhận nhập kho
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
