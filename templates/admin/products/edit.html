{% extends "layouts/admin_base.html" %}

{% block content %}
<div class="page-header">
    <h2><i class="bi bi-pencil-square me-2"></i>Sửa Sản Phẩm</h2>
    <a href="{{ url_for('admin.products') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Quay lại
    </a>
</div>

<div class="bg-white rounded-3 p-4 shadow-sm">
    <form action="{{ url_for('admin.edit_product', product_id=product.id) }}" method="POST" enctype="multipart/form-data">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label fw-semibold">Tên sản phẩm <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="name" required value="{{ product.name }}">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Hãng sản xuất <span class="text-danger">*</span></label>
                <select name="brand" class="form-select" required>
                    {% for b in ['ASUS', 'Dell', 'HP', 'Lenovo', 'Acer', 'MSI', 'Apple'] %}
                        <option value="{{ b }}" {% if product.brand == b %}selected{% endif %}>{{ b }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">CPU <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="cpu" required value="{{ product.cpu }}">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-semibold">RAM <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="ram" required value="{{ product.ram }}">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-semibold">Ổ cứng <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="storage" required value="{{ product.storage }}">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Màn hình <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="screen_size" required value="{{ product.screen_size }}">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Card đồ họa</label>
                <input type="text" class="form-control" name="gpu" value="{{ product.gpu or '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Ảnh sản phẩm</label>
                <input type="file" class="form-control" name="image" id="productImage" accept="image/*">
                {% if product.image %}
                    <img id="imagePreview" src="{{ url_for('static', filename='images/laptops/' + product.image) }}" alt="" class="mt-2 rounded" style="max-height:150px;">
                    <small class="text-muted d-block mt-1">Ảnh hiện tại: {{ product.image }}</small>
                {% else %}
                    <img id="imagePreview" src="" alt="" class="mt-2 rounded" style="display:none;max-height:150px;">
                {% endif %}
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                <input type="number" class="form-control" name="price" required min="0" value="{{ product.price }}">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Số lượng tồn kho</label>
                <input type="number" class="form-control" name="stock" min="0" value="{{ product.stock }}">
            </div>
            <div class="col-12">
                <label class="form-label fw-semibold">Mô tả</label>
                <textarea class="form-control" name="description" rows="4">{{ product.description or '' }}</textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary btn-lg px-4">
                    <i class="bi bi-check-circle me-1"></i> Cập nhật
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.getElementById('productImage').addEventListener('change', function(e) {
    const reader = new FileReader();
    reader.onload = function(event) {
        const preview = document.getElementById('imagePreview');
        preview.src = event.target.result;
        preview.style.display = 'block';
    }
    if (e.target.files[0]) {
        reader.readAsDataURL(e.target.files[0]);
    }
});
</script>
{% endblock %}
