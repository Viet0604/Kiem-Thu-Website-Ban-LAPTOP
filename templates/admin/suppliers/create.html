{% extends "layouts/admin_base.html" %}

{% block content %}
<div class="page-header">
    <h2><i class="bi bi-plus-circle me-2"></i>Thêm Nhà Cung Cấp</h2>
    <a href="{{ url_for('admin.suppliers') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Quay lại</a>
</div>

<div class="bg-white rounded-4 p-4 shadow-sm">
    <form action="{{ url_for('admin.create_supplier') }}" method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Tên nhà cung cấp <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="name" required placeholder="VD: Công ty TNHH ABC">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Người liên hệ</label>
                <input type="text" class="form-control" name="contact_person" placeholder="VD: Nguyễn Văn A">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Điện thoại</label>
                <input type="text" class="form-control" name="phone" placeholder="VD: 0281234567">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" name="email" placeholder="VD: sales@company.vn">
            </div>
            <div class="col-12">
                <label class="form-label fw-semibold">Địa chỉ</label>
                <textarea class="form-control" name="address" rows="2" placeholder="Địa chỉ nhà cung cấp"></textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-gradient btn-lg px-4">
                    <i class="bi bi-check-circle me-1"></i> Thêm nhà cung cấp
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
