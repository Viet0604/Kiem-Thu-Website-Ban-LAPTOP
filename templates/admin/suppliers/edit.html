{% extends "layouts/admin_base.html" %}

{% block content %}
<div class="page-header">
    <h2><i class="bi bi-pencil-square me-2"></i>Sửa Nhà Cung Cấp</h2>
    <a href="{{ url_for('admin.suppliers') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Quay lại</a>
</div>

<div class="bg-white rounded-4 p-4 shadow-sm">
    <form action="{{ url_for('admin.edit_supplier', supplier_id=supplier.id) }}" method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Tên nhà cung cấp <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="name" required value="{{ supplier.name }}">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Người liên hệ</label>
                <input type="text" class="form-control" name="contact_person" value="{{ supplier.contact_person or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Điện thoại</label>
                <input type="text" class="form-control" name="phone" value="{{ supplier.phone or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" name="email" value="{{ supplier.email or '' }}">
            </div>
            <div class="col-12">
                <label class="form-label fw-semibold">Địa chỉ</label>
                <textarea class="form-control" name="address" rows="2">{{ supplier.address or '' }}</textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-gradient btn-lg px-4">
                    <i class="bi bi-check-circle me-1"></i> Cập nhật
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
