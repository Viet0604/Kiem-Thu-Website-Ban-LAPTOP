{% extends "layouts/base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <i class="bi bi-laptop" style="font-size:2.5rem;"></i>
            <h3 class="mt-2">Đăng Nhập</h3>
            <p>Chào mừng bạn trở lại LaptopStore</p>
        </div>
        <div class="auth-body">
            <form action="{{ url_for('auth.login_form') }}" method="POST" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control border-start-0" id="email" name="email"
                               placeholder="example@email.com" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" name="password"
                               placeholder="Nhập mật khẩu" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
                </button>
            </form>
            <div class="text-center mt-3">
                <span class="text-muted">Chưa có tài khoản? </span>
                <a href="{{ url_for('auth.register') }}" class="fw-bold">Đăng ký ngay</a>
            </div>

            <hr>
            <div class="text-center">
                <small class="text-muted">
                    <strong>Demo Admin:</strong> admin@laptopstore.vn / admin123<br>
                    <strong>Demo User:</strong> user@gmail.com / user123
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
